# nginx inside the frontend container:
# - serves the built React app (dist/);
# - forwards /api/... to the backend container "api" (port 8000) on the chocolate_default network.
#   Same address for the page and the API, so the browser has no CORS problem.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. With a variable in proxy_pass nginx starts even if
    # the API container is not running yet (it returns 502 until it is up).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files have a hash in the name, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh (new deploy = new asset names)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
